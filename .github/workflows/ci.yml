name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/teams_dev?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          until docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          until docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
      - run: npm ci
      - run: npm test
      - name: Race tests, 20 rounds
        run: RACE_ROUNDS=20 npm run test:race
      - name: Chaos test, kill the server mid-join (2 rounds)
        run: CHAOS_ROUNDS=2 npm run chaos
      - name: Seed 10,000 users and check invariants
        run: node scripts/seed.js
