<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Finder</title>
  <meta name="description" content="Find teammates and form a team for the hackathon.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Team Finder</h1>
    <div class="top-right" id="top-right" hidden>
      <span class="live" id="live" role="status"></span>
      <span class="who" id="who"></span>
      <button type="button" class="ghost" id="logout">Sign out</button>
    </div>
  </header>

  <main>
    <section id="auth" class="card auth" hidden aria-labelledby="auth-title">
      <h2 id="auth-title">Sign in</h2>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Sign in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label id="name-row" hidden>Name
          <input name="displayName" autocomplete="name" maxlength="60">
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <p class="error" id="auth-error" role="alert"></p>
        <button type="submit" class="primary" id="auth-submit">Sign in</button>
      </form>
    </section>

    <div id="app" class="grid" hidden>
      <section class="card" aria-labelledby="board-title">
        <h2 id="board-title">Teams looking for people</h2>
        <p class="hint" id="board-hint"></p>
        <ul class="teams" id="board"></ul>
      </section>
      <section class="card" aria-labelledby="mine-title">
        <h2 id="mine-title">Your team</h2>
        <div id="mine"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
