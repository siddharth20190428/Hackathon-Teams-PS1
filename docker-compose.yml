# The whole system with one command:   docker compose up --build
# Then open http://localhost:3000. The first time, load the demo data (a hackathon "h1" must
# exist for the app to have anything to show):   docker compose run --rm seed
#
# MongoDB runs as a single-node replica set because transactions need one. The healthcheck
# starts the replica set the first time and reports healthy once it has a primary.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { if (rs.status().ok) quit(0) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } quit(1)"
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/teams_seed?replicaSet=rs0
      # A throwaway secret for local use. Set your own (32+ characters) for anything real:
      #   SESSION_SECRET=... docker compose up
      SESSION_SECRET: ${SESSION_SECRET:-local-only-secret-change-me-0123456789abcdef}
      PORT: "3000"

  # Demo data: 10,000 users and 2,000 teams, then the invariant check. Run on demand.
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/teams_seed?replicaSet=rs0
    command: ["node", "scripts/seed.js"]

volumes:
  mongo-data:
